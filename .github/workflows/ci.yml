name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: isort
        run: uv run isort --check-only --diff src tests

      - name: pylint
        run: uv run pylint src/update_dsa_sheet tests

      - name: Minimize uv cache
        run: uv cache prune --ci

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests with coverage
        run: uv run coverage run -m pytest

      - name: Coverage summary
        run: uv run coverage report -m

      - name: Generate coverage XML + JSON + HTML
        run: |
          uv run coverage xml
          uv run coverage json
          uv run coverage html

      - name: Upload coverage artifacts (only once)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            .coverage

      - name: Minimize uv cache
        run: uv cache prune --ci
