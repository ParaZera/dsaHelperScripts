[project]
name = "update-dsa-sheet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Tim Schrader", email = "tim.schrader92@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
]

[project.scripts]
update-dsa-sheet = "update_dsa_sheet:main"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "coverage>=7.6.1",
    "pylint>=3.2.6",
    "isort>=5.13.2",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
